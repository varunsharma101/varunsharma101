name: Update README cards

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate language card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          fail_on_error: "true"
          card: top-langs
          options: username=varunsharma101&layout=compact&langs_count=8&hide_border=false&border_color=414868&bg_color=1a1b27&title_color=70a5fd&text_color=38bdae
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics"
            git push
          fi

name: Generate contribution snake

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/activity.py
      - .github/scripts/keep_squares.py

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: varunsharma101
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#bf91f3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bf91f3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Slow the snake and keep contribution squares visible
        run: python3 .github/scripts/keep_squares.py
      - name: Generate activity chart
        run: python3 .github/scripts/activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
